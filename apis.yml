aid: penske
name: Penske
description: >-
  A diversified transportation services conglomerate operating truck leasing,
  logistics, automotive retail, and professional motorsports across North
  America. Penske Corporation spans Penske Truck Leasing (full-service leasing,
  rental, and contract maintenance), Penske Logistics (supply chain management,
  warehousing, distribution, dedicated contract carriage), Penske Automotive
  Group (retail automotive dealerships in the US, UK, Germany, Italy, Japan,
  Australia, and New Zealand), and Team Penske (motorsports). The corporate
  parent has 73,000+ employees and approximately $43B+ in consolidated revenue.
  Customer self-service is delivered through web and mobile portals (Penske Fleet
  Insight, Penske Truck Leasing app, Penske Truck Rental); Penske does not
  publish a public developer API or partner integration portal. Penske
  Automotive Group is the publicly traded subsidiary (NYSE - PAG).
